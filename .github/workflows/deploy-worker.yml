name: Deploy application Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Ensure outbound media bucket
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 worker/ensure_media_bucket.py
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.130.0"
          workingDirectory: worker
          secrets: |
            RESEND_API_KEY
            FIELDNOTES_UPLOAD_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIELDNOTES_UPLOAD_KEY: ${{ secrets.FIELDNOTES_UPLOAD_KEY }}
